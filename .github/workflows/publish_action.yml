name: Publish to Comfy registry

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "pyproject.toml"

permissions:
  contents: read

# Two publishes of the same version would collide; let a queued run wait its turn.
concurrency:
  group: registry-publish
  cancel-in-progress: false

jobs:
  publish-node:
    name: Publish Custom Node to registry
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install comfy-cli
        run: pip install "comfy-cli>=1.24,<2"
      - name: Publish
        env:
          REGISTRY_ACCESS_TOKEN: ${{ secrets.REGISTRY_ACCESS_TOKEN }}
        run: |
          comfy --skip-prompt --no-enable-telemetry env > /dev/null
          comfy tracking disable
          comfy node publish --token "$REGISTRY_ACCESS_TOKEN"
